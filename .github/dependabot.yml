# Dependabot 설정.
#
# 이 파일은 **버전 업데이트 PR**만 담당한다. 보안 경고(Dependabot alerts)는 저장소
# 설정이라 여기서 못 켠다 — Settings > Code security 에서 한 번 켜야 한다.
#
# **묶되, 검증 방법이 다른 것끼리는 쪼갠다.** 관리자가 한 명인 저장소라 PR이 쏟아지면
# 아무것도 안 보게 되므로 묶는 것이 기본이다. 다만 생태계마다 하나로 몰아넣으면
# 서로 무관한 이유로 한꺼번에 깨져 몇 주씩 아무것도 못 올리는 일이 생긴다
# (School-Record-App에서 실제로 겪은 일이다). 그래서 **한 PR 안의 것들이 같은
# 방법으로 검증되는지**를 기준으로 나눈다.
#
# 이 앱에서 특히 조심할 것은 **교사가 넣는 명렬표 파일을 파싱하는 의존성**이다.
# 남이 만든 파일을 여는 코드라 여기 취약점은 우리 신뢰 경계 안에 있다.
# exceljs가 그것이고, SheetJS는 아래 이유로 dependabot이 손대지 못한다.

version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # 그룹 수만큼 한도를 준다. 낮으면 일부 그룹이 아예 안 올라온다.
    open-pull-requests-limit: 4
    ignore:
      # SheetJS는 npm 저장소에 없고 vendor/의 tarball로 들어온다(package.json의
      # file: 참조). dependabot이 올릴 수 없으므로 **손으로 챙겨야 한다.**
      # 사용자 파일을 파싱하는 코드라 방치하면 안 된다 — 배포처의 새 버전을
      # 주기적으로 확인하고 vendor/의 tarball을 갈아 끼운다.
      - dependency-name: xlsx
    groups:
      # 교사가 넣는 파일을 파싱하는 것. 따로 보고 싶어 먼저 잡는다.
      # 확인은 rosterFile.test.js(진짜 xlsx 바이트를 만들어 되읽는다)로 한다.
      parsers:
        patterns:
          - exceljs
      # 런타임 프레임워크. 앱 동작에 직접 영향이 가므로 실제로 실행해봐야 안다.
      # pinia는 CLAUDE.md가 "Store = single source of truth"로 못박은 아키텍처의
      # 중심이라 메이저 업그레이드는 단독으로 보고 싶다.
      vue:
        patterns:
          - vue
          - pinia
          - vue-router
      # 빌드·테스트 도구. 깨지면 빌드가 안 되지 앱 동작이 틀리지는 않는다.
      # 서로 peer로 엮여 있어 따로 올리면 설치 단계에서 막히므로 묶는다.
      build:
        patterns:
          - vite
          - '@vitejs/*'
          - vitest
          - tailwindcss
          - '@tailwindcss/*'
      # 나머지(@tauri-apps/*, pretendard 등).
      # '*'는 먼저 매칭되는 그룹이 이기므로 반드시 마지막에 둔다.
      frontend:
        patterns:
          - '*'

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      # DB. rusqlite는 **번들 SQLite 엔진 버전이 같이 올라간다.** 사용자 PC의 기존
      # DB 파일을 다루므로 확인 방법이 다르다 — 스키마 잠금 테스트가 통과하는지,
      # 실제 파일이 열리는지 봐야 한다.
      database:
        patterns:
          - rusqlite
          - libsqlite3-sys
      # 프레임워크. 깨지면 앱이 아예 안 뜨므로 위험 등급이 따로다.
      # JS 쪽 @tauri-apps/*와 버전이 어긋나면 IPC에서 문제가 난다.
      tauri:
        patterns:
          - tauri
          - tauri-*
      # 나머지(serde, chrono, uuid, base64 등). 대개 그냥 통과한다.
      backend:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns:
          - '*'
