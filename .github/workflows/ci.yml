name: CI

on:
  pull_request:
  push:
    # '**'는 슬래시가 들어간 이름(dependabot/...)까지 포함한 모든 브랜치다.
    # 태그 push에는 반응하지 않는다 — 그건 release 워크플로가 맡는다.
    branches:
      - '**'

# 같은 브랜치에 연속으로 push하면 진행 중이던 이전 실행을 취소한다.
# PR 이벤트에서 github.ref는 refs/pull/N/merge가 되므로, 같은 PR의 연속 push를
# 묶으려면 head_ref(원본 브랜치명)를 먼저 본다.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    # 이 앱은 윈도우용이다(NSIS 설치본, 윈도우 경로 처리). 같은 OS에서 검사해야
    # 경로·파일 잠금처럼 윈도우에서만 나는 문제가 CI에서 잡힌다. 리눅스에서 돌리면
    # webkit 개발 패키지를 깔아야 하는 대가까지 치르면서 그 문제는 못 잡는다.
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Node 설치
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Rust stable 설치
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 의존성 설치
        # npm install과 달리 락파일을 고치지 않고 그대로 설치한다.
        # 같은 커밋이면 항상 같은 의존성으로 검사된다.
        # SheetJS는 vendor/의 tarball에서 설치되므로 별도 처리가 필요 없다.
        run: npm ci

      - name: 테스트
        run: npm test

      - name: 빌드
        # --no-bundle은 NSIS 패키징만 건너뛴다. 프런트엔드 컴파일과 릴리스 모드
        # Rust 빌드는 그대로 수행되므로, 테스트가 못 잡는 Vue 템플릿 오류가 여기서 잡힌다.
        # 설치본 패키징은 release 워크플로에서만 한다.
        run: npm run build -- --no-bundle

  # 웹앱은 별도 앱이라 별도 잡이다. Tauri와 무관하므로 리눅스에서 빠르게 돌린다.
  # pages 워크플로는 web/이 바뀔 때만 도는데, 그것만 믿으면 배포 시점에야 깨진 걸
  # 알게 된다. 모든 push에서 여기서 먼저 잡는다.
  web:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Node 설치
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: 의존성 설치
        working-directory: web
        run: npm ci

      - name: 테스트
        working-directory: web
        run: npm test

      - name: 빌드
        working-directory: web
        run: npm run build
