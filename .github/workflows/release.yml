name: release

# 손으로 돌린다. 태그 push로 자동 배포하지 않는 이유는, 태그와
# tauri.conf.json의 version이 어긋난 채 배포되는 사고가 흔하기 때문이다.
# 버전은 tauri.conf.json 하나만 본다.
on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.VERSION }}

    steps:
      - uses: actions/checkout@v7

      # 확인을 먼저 한다. 15분짜리 빌드를 끝낸 뒤 "이미 있는 릴리스입니다"로
      # 실패하는 일을 막는다. 검사와 빌드를 다른 잡으로 나누면 Rust를 두 번
      # 컴파일하게 되므로 한 잡 안에 순서로 둔다.
      - name: 버전 읽기
        id: version
        shell: bash
        run: |
          VERSION=$(node -p 'require("./src-tauri/tauri.conf.json").version')
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "배포할 버전: $VERSION"

      - name: 같은 버전의 릴리스가 이미 있는지
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "::error::v$VERSION 릴리스가 이미 있습니다. src-tauri/tauri.conf.json의 version을 올려주세요."
            exit 1
          fi

      - name: Node 설치
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Rust stable 설치
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 의존성 설치
        run: npm ci

      # 테스트가 깨진 버전이 배포되지 않게 빌드 전에 돌린다.
      - name: 테스트
        run: npm test

      - name: 빌드
        # 한 번의 빌드가 설치본(NSIS)과 실행 파일을 모두 만든다.
        # 포터블용으로 --no-bundle을 한 번 더 돌릴 필요가 없다.
        run: npm run build

      - name: 산출물 이름 정리
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          mkdir -p dist-release

          # 제품명이 한글이라 번들 파일명도 한글이다. 내려받는 쪽에서 깨지지 않도록
          # 아스키 이름으로 바꿔 올린다.
          SETUP=$(ls src-tauri/target/release/bundle/nsis/*.exe | head -1)
          cp "$SETUP" "dist-release/rollcall-${VERSION}-windows-x64-setup.exe"
          cp "src-tauri/target/release/rollcall.exe" \
             "dist-release/rollcall-${VERSION}-windows-x64-portable.exe"

      - name: 압축
        # .exe를 그대로 올리면 브라우저와 백신이 내려받기를 막는 경우가 있다.
        shell: pwsh
        run: |
          Get-ChildItem dist-release/*.exe | ForEach-Object {
            Compress-Archive -Path $_.FullName -DestinationPath ($_.FullName -replace '\.exe$', '.zip')
            Remove-Item $_.FullName
          }

      - name: 산출물 업로드
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: dist-release/*.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: 산출물 내려받기
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: 초안 릴리스 만들기
        # 초안으로 둔다. 릴리스 노트를 손보고 사람이 직접 공개한다.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes "아래 파일을 내려받아 설치하세요. 설치본(setup)과 포터블 중 하나를 고르면 됩니다." \
            --draft \
            artifacts/*
